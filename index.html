<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hearth · Private AI chat</title>
  <meta name="apple-mobile-web-app-title" content="Hearth" />
  <meta name="description" content="Hearth is a private AI chat that lives in your browser. No server. No account. Works offline." />
  <meta property="og:title" content="Hearth · Private AI chat" />
  <meta property="og:description" content="A private AI chat that lives in your browser. No server. No account. Works offline." />
  <meta name="theme-color" content="#0f0f0f" />

  <!-- Theme: runs before the page is drawn, so a light device never sees a
       dark flash. The choice (Settings → Appearance) is "system" (default:
       follow the device), "light" or "dark"; <html data-theme> always holds
       the theme in use, which style.css reads. app.js uses window.appTheme. -->
  <script>
    (function () {
      var KEY = "webllm-theme";
      var BG = { dark: "#0f0f0f", light: "#f6f4ef" }; // --bg of each theme
      var query = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
      function pref() {
        try { var v = localStorage.getItem(KEY); return v === "light" || v === "dark" ? v : "system"; }
        catch (e) { return "system"; }
      }
      function resolved(p) {
        return p === "system" ? (query && query.matches ? "light" : "dark") : p;
      }
      function apply() {
        var theme = resolved(pref());
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", BG[theme]);
        return theme;
      }
      window.appTheme = {
        pref: pref,
        current: function () { return resolved(pref()); },
        set: function (p) {
          try {
            if (p === "light" || p === "dark") localStorage.setItem(KEY, p);
            else localStorage.removeItem(KEY);
          } catch (e) {}
          return apply();
        },
      };
      if (query) {
        var onChange = function () { if (pref() === "system") apply(); };
        if (query.addEventListener) query.addEventListener("change", onChange);
        else if (query.addListener) query.addListener(onChange);
      }
      apply();
    })();
  </script>

  <!-- Installable app (PWA); sw.js keeps it working offline -->
